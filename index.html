 before setting off.</div></div><div class="panel"><h3>🗓 Your flexible itinerary</h3><p class="small muted" style="margin-top:5px">${esc(fmtDate(f.start))} to ${esc(fmtDate(f.end))} · ${total} days. Suggested structure, not a verified booking or fixed timetable.</p>${Array.from({length:Math.min(total,30)},(_,i)=>dayPlan(d,i,total)).join('')}${total>30?'<p class="small muted">For now itineraries display up to 30 days.</p>':''}</div><div class="panel"><h3>🧭 Maps & facilities</h3><div class="actions">${link(google(d),'Navigate in Google Maps')}${link(map(d),'View destination map')}</div><div class="actions">${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('cafes near '+d.name),'Cafés')}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('petrol stations near '+d.name),'Fuel stations')}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('supermarkets near '+d.name),'Shops')}</div></div>${overnightOptions(d)}<div class="panel"><h3>💷 Cost breakdown</h3><div class="item item-head"><span>Estimated return fuel</span><b>${money(fuelCost(mi*2))}</b></div><div class="item item-head"><span>Free parking (only if permitted)</span><b>£0</b></div><div class="item item-head"><span>Optional campsite ceiling / night</span><b>${money(state.settings.campBudget)}</b></div><div class="item item-head"><span>Parking, attractions, food</span><b>Not verified</b></div><p class="small muted" style="margin-top:9px">Fuel is based on approximate mileage, ${state.settings.mpg} UK mpg and £${state.settings.fuel}/litre. The actual total may be higher.</p></div>`}
function backResults(){detail=null;page=previous==='saved'?'saved':'results';render();window.scrollTo(0,scrollPos)}function openTrip(id){if(page==='results')scrollPos=window.scrollY;previous=page;detail=id;page='trip';render();window.scrollTo(0,0);refreshWeather([id]);fetchOvernight(findDest(id))}function toggleSave(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()}function markVisited(id){if(!state.visited.some(x=>x.id===id))state.visited.unshift({id,date:iso(new Date())});save();render()}
function savedPage(){let a=state.saved.map(findDest).filter(Boolean);return `<div class="sectionline"><h2>♡ Saved adventures</h2><span class="pill">${a.length} saved</span></div>${a.length?a.map(result).join(''):'<div class="empty">Save a destination from its trip details to see it here.</div>'}<div class="panel"><h3>Places you have visited</h3>${state.visited.length?state.visited.map(v=>`<div class="item item-head"><span>${esc(findDest(v.id)?.name||v.id)} <span class="muted small">${esc(v.date)}</span></span>${btn('Open',`openTrip('${v.id}')`,'smallbtn')}</div>`).join(''):'<p class="small muted" style="margin-top:8px">Your visited destinations will appear here.</p>'}</div><div class="panel"><h3>Supplies checklist</h3>${state.supplies.map((s,i)=>`<div class="check"><input type="checkbox" ${s.done?'checked':''} onchange="state.supplies[${i}].done=this.checked;save();render()"><span class="${s.done?'strike':''}">${esc(s.name)}</span><button class="btn smallbtn" onclick="state.supplies.splice(${i},1);save();render()">×</button></div>`).join('')}<div class="fieldrow"><input id="newSupply" placeholder="Add an item"><button class="btn primary" onclick="addSupply()">Add item</button></div></div>`}function addSupply(){let s=$('newSupply')?.value.trim();if(!s)return;state.supplies.push({name:s,done:false});save();render()}
function stopsPage(){return `<div class="sectionline"><h2>⌖ Your overnight stops</h2><span class="pill">${state.stops.length} saved</span></div><div class="notice">Saving a location does not verify that sleeping overnight is permitted. Record the source and restrictions, and recheck before travelling.</div><div class="panel"><h3>Add your own location</h3><label>Location name</label><input id="stopName" placeholder="e.g. Favourite coastal stop"><div class="fieldrow"><div><label>Latitude (optional)</label><input id="stopLat" type="number" step="any" placeholder="51.123"></div><div><label>Longitude (optional)</label><input id="stopLon" type="number" step="any" placeholder="-4.123"></div></div><label>Permission status</label><select id="stopPermission"><option value="Unverified">Unverified</option><option value="Previously used, recheck">Previously used, recheck</option><option value="Permission confirmed at time of visit">Permission confirmed at time of visit</option><option value="Not permitted">Not permitted</option></select><label>Facilities and personal notes</label><textarea id="stopNotes" placeholder="Toilets, pub, access, restrictions, whether worth revisiting…"></textarea><div class="actions">${btn('Save overnight stop','addStop()','primary')}</div></div>${state.stops.map((s,i)=>`<div class="panel"><div class="item-head"><div><h3>${esc(s.name)}</h3><p class="small muted">${esc(s.permission)}</p></div>${btn('Delete',`deleteStop(${i})`,'smallbtn outline')}</div><p class="small muted" style="white-space:pre-wrap;margin-top:9px">${esc(s.notes)}</p>${s.lat!==null&&s.lon!==null?`<div class="actions">${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lat+','+s.lon),'Open map')}</div>`:''}</div>`).join('')}`}
function addStop(){let name=$('stopName').value.trim(),lat=$('stopLat').value,lon=$('stopLon').value;if(!name){flash('Enter a location name.');return}if((lat&&!lon)||(!lat&&lon)||(lat&&(!Number.isFinite(+lat)||Math.abs(+lat)>90))||(lon&&(!Number.isFinite(+lon)||Math.abs(+lon)>180))){flash('Enter valid latitude and longitude, or leave both empty.');return}state.stops.unshift({name,lat:lat!==''?+lat:null,lon:lon!==''?+lon:null,permission:$('stopPermission').value,notes:$('stopNotes').value,added:iso(new Date())});save();render()}function deleteStop(i){if(confirm('Delete this saved overnight location?')){state.stops.splice(i,1);save();render()}}
function settingsPage(){let s=state.settings;return `<div class="sectionline"><h2>⚙ Vehicle & preferences</h2><span class="pill">V${VERSION}</span></div><div class="panel"><h3>Starting point</h3><label>Home / departure area</label><input id="home" value="${esc(s.home)}"><p class="small muted" style="margin-top:8px">Enter your home location and matching coordinates. Until set, distances use an example starting point near Barnstaple and must not be relied on.</p><div class="fieldrow"><div><label>Latitude</label><input id="homeLat" type="number" step="any" value="${s.lat}"></div><div><label>Longitude</label><input id="homeLon" type="number" step="any" value="${s.lon}"></div></div><h3 style="margin-top:18px">Your campervan</h3><div class="fieldrow"><div><label>Make</label><input id="make" value="${esc(s.make||'')}" placeholder="Volkswagen"></div><div><label>Model</label><input id="model" value="${esc(s.model||'')}" placeholder="Transporter"></div><div><label>Year</label><input id="year" type="number" min="1950" max="2030" value="${esc(s.year||'')}" placeholder="2020"></div><div><label>Engine / variant</label><input id="engine" value="${esc(s.engine||'')}" placeholder="2.0 TDI"></div></div><label>Make / model (optional)</label><input id="van" value="${esc(s.van)}" placeholder="Your campervan"><div class="fieldrow"><div><label>Fuel type</label><select id="fuelType"><option ${s.type==='Diesel'?'selected':''}>Diesel</option><option ${s.type==='Petrol'?'selected':''}>Petrol</option></select></div><div><label>UK MPG (editable real-world value)</label><input id="mpg" type="number" min="1" step="0.1" value="${s.mpg}"></div><div><label>Fuel £ / litre</label><input id="fuel" type="number" min="0" step="0.01" value="${s.fuel}"></div><div><label>Tank capacity (litres)</label><input id="tank" type="number" min="0" value="${s.tank}"></div><div><label>Height (m)</label><input id="height" type="number" min="0" step="0.01" value="${esc(s.height)}" placeholder="Optional"></div><div><label>Length (m)</label><input id="length" type="number" min="0" step="0.01" value="${esc(s.length)}" placeholder="Optional"></div></div><label>Width (m)</label><input id="width" type="number" min="0" step="0.01" value="${esc(s.width)}" placeholder="Optional"><p class="small muted" style="margin-top:10px">Automatic vehicle MPG lookup requires a reliable vehicle-specification provider. Until connected, enter your real-world MPG; make, model and year are saved for later matching.</p><label>Preferred maximum campsite price (£ / night)</label><input id="campBudget" type="number" min="0" value="${s.campBudget}"><h3 style="margin-top:20px">Interests</h3><div class="profile-tags">${['beach','coast','waterfall','walk','forest','viewpoint','garden','wildlife','countryside','quiet','national trust'].map(t=>`<label><input type="checkbox" class="interest" value="${t}" ${(s.interests||[]).includes(t)?'checked':''}>${t}</label>`).join('')}</div><h3 style="margin-top:18px">Memberships</h3><div class="profile-tags">${['National Trust','National Trust for Scotland','Caravan and Motorhome Club','Camping and Caravanning Club','English Heritage','Historic Scotland','Cadw'].map(t=>`<label><input type="checkbox" class="membership" value="${t}" ${(s.memberships||[]).includes(t)?'checked':''}>${t}</label>`).join('')}</div><label>Other membership</label><input id="otherMembership" value="${esc(s.otherMembership||'')}" placeholder="Optional"><label>Overnight stop search radius (miles)</label><input id="stopRadius" type="number" min="5" max="300" value="${s.stopRadius||65}"><p class="small muted">This controls saved-stop matching. Public OpenStreetMap searches use a capped search radius plus corridor sample points.</p><div class="actions">${btn('Save preferences','saveSettings()','primary')}</div></div><div class="panel"><h3>Backup & restore</h3><p class="small muted" style="margin:8px 0">Data is stored locally in this browser. Clearing site data, changing devices or reinstalling may erase it. Export backups regularly.</p><div class="actions">${btn('Export backup','exportData()','outline')}<label class="btn outline" style="text-align:center;margin:0;cursor:pointer">Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="panel"><h3>Current data coverage</h3><p class="small muted" style="margin-top:8px">Curated destinations: ${DEST.length}. Live forecast: Open-Meteo (up to 16 days, network required). Driving distances: rough geographic estimates. OpenStreetMap campsite and tagged parking discovery is available in trip details. Overnight permission, campsite availability, prices, trails, photos and opening times: not independently verified. Google Maps is used externally for navigation and facility searches.</p></div>`}
function saveSettings(){let s=state.settings,fields={home:'home',lat:'homeLat',lon:'homeLon',van:'van',make:'make',model:'model',year:'year',engine:'engine',otherMembership:'otherMembership',stopRadius:'stopRadius',type:'fuelType',mpg:'mpg',fuel:'fuel',tank:'tank',height:'height',length:'length',width:'width',campBudget:'campBudget'};for(let [k,id]of Object.entries(fields)){let v=$(id).value;s[k]=['lat','lon','mpg','fuel','tank','height','length','width','campBudget','year','stopRadius'].includes(k)?(v===''?'':+v):v}s.interests=[...document.querySelectorAll('.interest:checked')].map(e=>e.value);s.memberships=[...document.querySelectorAll('.membership:checked')].map(e=>e.value);if(!Number.isFinite(s.lat)||Math.abs(s.lat)>90||!Number.isFinite(s.lon)||Math.abs(s.lon)>180||!Number.isFinite(s.mpg)||s.mpg<=0||!Number.isFinite(s.fuel)||s.fuel<0||!Number.isFinite(s.campBudget)||s.campBudget<0){flash('Check coordinates, MPG and fuel price.');return}save();flash('Vehicle settings saved. Remember to update home coordinates when changing the address.')}function exportData(){let blob=new Blob([JSON.stringify({app:'Roam Campervan Planner',version:VERSION,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='roam-campervan-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='Roam Campervan Planner'||!obj.data||!Array.isArray(obj.data.stops)||!Array.isArray(obj.data.saved)||!Array.isArray(obj.data.visited)||!Array.isArray(obj.data.supplies)||!obj.data.settings||typeof obj.data.settings!=='object')throw Error('Invalid backup');if(!confirm('Replace all current local data with this backup?'))return;state={...structuredClone(DEFAULT),...obj.data,settings:{...DEFAULT.settings,...obj.data.settings},filters:{...DEFAULT.filters,...obj.data.filters}};save();flash('Backup imported.')}catch(e){flash('Import failed: '+e.message)}}
function render(){nav();let content=page==='explore'?form():page==='results'?results():page==='trip'?trip():page==='saved'?savedPage():page==='stops'?stopsPage():settingsPage();$('app').innerHTML=`<header class="top"><div class="brand">✦ roam<span>.</span></div><span class="pill">YOUR CAMPERVAN COMPANION</span></header>${notice?`<div class="notice success">${esc(notice)}</div>`:''}${content}<footer class="footer">Roam V${VERSION} · Trip planner · Always check local conditions and overnight rules</footer>`}
// Keep search history and saved trips after reopening. Recheck weather without silently changing results order.
render();
</script></body></html>
